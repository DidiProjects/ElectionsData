services:
  worker:
    build: .
    container_name: elections-data-worker
    env_file: .env
    environment:
      - OUTPUT_DIR=/data/output
      - STATE_DIR=/data/state
    volumes:
      - ${OUTPUT_HOST_DIR:-./output}:/data/output
      - ${STATE_HOST_DIR:-./state}:/data/state
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
