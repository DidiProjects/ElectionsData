name: Deploy to Home Server

on:
  push:
    branches: [ main ]
  # Runs the suite on PRs to main too, so the gate acts before the merge.
  # The deploy job is restricted to push (see its `if`).
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The repository and migration tests only run with TEST_DATABASE_URL set.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: elections_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elections_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/elections_test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Never deploy from a PR — only from a push to main
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:buildcache,mode=max

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull and deploy on Home Server
        run: |
          REPO_LOWER="${{ steps.repo.outputs.name }}"
          OUTPUT_HOST_DIR="${{ vars.OUTPUT_HOST_DIR || '/srv/elections-data/output' }}"
          ssh -o StrictHostKeyChecking=no -p 1024 diego@${{ vars.TAILSCALE_IP }} << EOF

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

          sudo docker pull ghcr.io/${REPO_LOWER}:latest

          # ── Network and Postgres ───────────────────────────────────────
          # The worker reaches the database by name (elections-postgres) on a
          # dedicated network, without publishing 5432 on the host.
          sudo docker network inspect elections-network >/dev/null 2>&1 || \
            sudo docker network create elections-network

          if ! sudo docker ps -a --format '{{.Names}}' | grep -q '^elections-postgres$'; then
            sudo docker run -d --name elections-postgres \
              --label project=elections-data \
              --network=elections-network \
              --restart=unless-stopped \
              -e POSTGRES_DB=elections \
              -e POSTGRES_USER=elections \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -v elections_postgres_data:/var/lib/postgresql/data \
              postgres:16-alpine
          else
            sudo docker start elections-postgres || true
          fi

          echo "Waiting for Postgres to accept connections..."
          for i in \$(seq 1 30); do
            if sudo docker exec elections-postgres pg_isready -U elections -d elections >/dev/null 2>&1; then
              echo "Postgres ready"
              break
            fi
            [ \$i -eq 30 ] && { echo "Postgres did not come up in time"; exit 1; }
            sleep 2
          done

          # The container runs as the image's "node" user (uid 1000) and must own the CSV folder.
          sudo mkdir -p "${OUTPUT_HOST_DIR}"
          sudo chown 1000:1000 "${OUTPUT_HOST_DIR}"

          sudo docker stop elections-data-worker || true
          sudo docker rm elections-data-worker || true

          # No published port: the worker only reads env, talks to Postgres and writes CSVs.
          # Migrations run on start; a failure exits 1, which the next step catches.
          sudo docker run -d --name elections-data-worker \
            --label app=elections-data-worker \
            --label project=elections-data \
            --restart=unless-stopped \
            --network=elections-network \
            --log-opt max-size=10m --log-opt max-file=3 \
            -v "${OUTPUT_HOST_DIR}:/data/output" \
            -e OUTPUT_DIR=/data/output \
            -e DATABASE_URL="postgresql://elections:${{ secrets.POSTGRES_PASSWORD }}@elections-postgres:5432/elections" \
            -e ELECTION_CYCLE="${{ vars.ELECTION_CYCLE }}" \
            -e PLEITO_CODE="${{ vars.PLEITO_CODE }}" \
            -e OFFICE_CODES="${{ vars.OFFICE_CODES }}" \
            -e STATES="${{ vars.STATES }}" \
            -e SCHEDULE_START="${{ vars.SCHEDULE_START }}" \
            -e SCHEDULE_END="${{ vars.SCHEDULE_END }}" \
            -e POLL_INTERVAL_SECONDS="${{ vars.POLL_INTERVAL_SECONDS || '60' }}" \
            -e OUTPUT_PREFIX="${{ vars.OUTPUT_PREFIX || 'secoes' }}" \
            -e MAX_CSV_VERSIONS="${{ vars.MAX_CSV_VERSIONS || '1000' }}" \
            -e MAX_RETRIES="${{ vars.MAX_RETRIES || '3' }}" \
            -e CONCURRENCY="${{ vars.CONCURRENCY || '8' }}" \
            -e LOG_LEVEL="${{ vars.LOG_LEVEL || 'info' }}" \
            ghcr.io/${REPO_LOWER}:latest

          EOF

      - name: Verify deployment success
        run: |
          ssh -o StrictHostKeyChecking=no -p 1024 diego@${{ vars.TAILSCALE_IP }} << 'EOF'

          echo "Waiting for the container to start..."
          sleep 10

          # Invalid configuration or a failed migration makes the worker exit 1 right away
          # and Docker restart it, so "running with no restarts" after 10s means it started.
          if [ "$(sudo docker inspect -f '{{.State.Status}}/{{.RestartCount}}' elections-data-worker 2>/dev/null)" = "running/0" ]; then
            echo "elections-data-worker is running"
            sudo docker logs --tail 20 elections-data-worker
          else
            echo "elections-data-worker is not running"
            sudo docker logs --tail 50 elections-data-worker
            exit 1
          fi

          EOF

      - name: Final status and cleanup
        run: |
          ssh -o StrictHostKeyChecking=no -p 1024 diego@${{ vars.TAILSCALE_IP }} << 'EOF'

          echo "=== Final status ==="
          sudo docker ps --filter "label=project=elections-data" --format "table {{.Names}}\t{{.Status}}"
          sudo docker stats --no-stream elections-data-worker || echo "Stats unavailable"

          echo "=== Safe cleanup (elections-data only) ==="
          sudo docker images --filter "dangling=true" --filter "label=app=elections-data-worker" -q | \
            xargs -r sudo docker rmi || true
          sudo docker ps -a --filter "name=elections-data-worker" --filter "status=exited" -q | \
            xargs -r sudo docker rm || true

          sudo docker system df

          EOF
